name: Refresh public contribution stats

on:
  schedule:
    - cron: '25 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh README and SVGs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/generate_stats.py
      - name: Commit updated public statistics
        run: |
          git config user.name 'Yzzz88'
          git config user.email 'Yzzz88@users.noreply.github.com'
          git add README.md assets data/stats.json
          if ! git diff --cached --quiet; then
            git commit -m "docs: refresh public contribution stats"
            git push
          fi
